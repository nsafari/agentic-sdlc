name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html styles.css app.js data.js data-fa.js i18n.js myNeirizi.ttf _site/
          cp -r vendor/ docs/ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
